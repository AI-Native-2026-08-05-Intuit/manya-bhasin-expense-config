apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-api-config
  namespace: expense-dev
  labels:
    app.kubernetes.io/name: expense-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: expense-tracking
    app.kubernetes.io/managed-by: kubectl
data:
  SPRING_PROFILES_ACTIVE: dev
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.expense-dev.svc.cluster.local:5432/expense_tracking
  SPRING_DATASOURCE_USERNAME: expense_api
  SPRING_REDIS_HOST: redis.expense-dev.svc.cluster.local
  SPRING_DATA_MONGODB_URI: mongodb://mongo.expense-dev.svc.cluster.local:27017/expense
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka.expense-dev.svc.cluster.local:9092
  LOG_LEVEL: INFO
  OTEL_SDK_DISABLED: "true"
