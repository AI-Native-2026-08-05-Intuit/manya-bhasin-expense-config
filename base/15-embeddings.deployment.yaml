apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: expense-dev
  labels:
    app: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
          args:
            - --model-id
            - BAAI/bge-large-en-v1.5
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: expense-dev
  labels:
    app: embeddings
spec:
  selector:
    app: embeddings
  ports:
    - name: http
      port: 80
      targetPort: 80
