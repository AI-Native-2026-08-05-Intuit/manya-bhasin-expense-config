apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  namespace: expense-dev
  labels:
    app: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embeddings
  template:
    metadata:
      labels:
        app: embeddings
    spec:
      containers:
        - name: tei
          # Assignment image cpu-1.5 is amd64-only. This Apple Silicon k3d
          # cluster cannot unpack it (ctr: no match for platform). Use the
          # course ARM64 TEI image; it still serves BAAI/bge-large-en-v1.5
          # (1024-d) on :80.
          image: 625397071689.dkr.ecr.us-east-1.amazonaws.com/uptimecrew/tei-arm64-dev:bge-large-en-v1.5-cpu-arm64
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - BAAI/bge-large-en-v1.5
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  namespace: expense-dev
  labels:
    app: embeddings
spec:
  selector:
    app: embeddings
  ports:
    - name: http
      port: 80
      targetPort: 80
