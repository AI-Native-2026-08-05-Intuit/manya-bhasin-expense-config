# base/51-prometheus-adapter-values.yaml
# TASK 2: map the Micrometer gauge into the custom-metrics API so the HPA can
# read it. prometheusUrl points at the kube-prometheus-stack Prometheus
# Service (installed via Helm into the monitoring namespace -- a cluster-admin
# prerequisite, not something this Kustomize base applies). This file is Helm
# values, consumed by:
#   helm upgrade --install prometheus-adapter prometheus-community/prometheus-adapter \
#     -n monitoring -f base/51-prometheus-adapter-values.yaml
# It is not listed in kustomization.yaml -- kubectl/kustomize cannot apply
# Helm values as a resource.
prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  port: 9090
rules:
  custom:
    - seriesQuery: 'expense_inflight_requests{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: namespace}
          pod: {resource: pod}
      name:
        matches: "expense_inflight_requests"
        as: "expense_inflight_requests"
      metricsQuery: 'avg_over_time(expense_inflight_requests{<<.LabelMatchers>>}[1m])'
