# base/11-expense-api-worker.deployment.yaml
# TASK 1 (RUNNABLE on k3d): the KEDA scale target. Same image as expense-api,
# run in the `worker` profile (stacked on `dev` so it keeps the dev-env
# datasource/Kafka/Mongo hosts from expense-api-config, per SPRING_PROFILES_ACTIVE
# below): consumes merchants.events on its own consumer group, re-projects the
# Mongo read model, serves no HTTP. Starts at 0 replicas -- KEDA owns the count
# from here (do NOT set spec.replicas above 0 AND run the ScaledObject; that is
# a sync war -- see the HPA note on 50-expense-api.hpa.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-api-worker
  namespace: expense-dev
  labels:
    app.kubernetes.io/name: expense-api-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: expense-tracking
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: expense-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expense-api-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: expense-tracking
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: worker
          image: uptimecrew/expense-api:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: expense-api-config
            - secretRef:
                name: expense-api-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
            - name: SPRING_PROFILES_ACTIVE
              value: dev,worker
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api
                  key: ANTHROPIC_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              memory: 1Gi
