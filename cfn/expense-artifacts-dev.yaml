# cfn/expense-artifacts-dev.yaml
# Hardened S3 artefact bucket. Independent of network; deploy before app.
AWSTemplateFormatVersion: "2010-09-09"
Description: expense hardened artefact bucket (Task 3).

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  OwnerTag:
    Type: String
    Default: manya-bhasin
  PersonName:
    Type: String
    Default: manya

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: Access logging needs a separate bucket; out of scope for Day 3.
    Properties:
      BucketName: !Sub "expense-artifacts-${EnvName}-${PersonName}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: alias/aws/s3
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: tier-to-ia-then-glacier
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
              - StorageClass: GLACIER_IR
                TransitionInDays: 365
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - {Key: Environment, Value: !Ref EnvName}
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub "${ArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: DenyUnencryptedPut
            Effect: Deny
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${ArtifactsBucket.Arn}/*"
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export: {Name: !Sub "${AWS::StackName}-BucketName"}
  ArtifactsBucketArn:
    Value: !GetAtt ArtifactsBucket.Arn
    Export: {Name: !Sub "${AWS::StackName}-BucketArn"}
