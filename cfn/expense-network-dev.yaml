AWSTemplateFormatVersion: "2010-09-09"
Description: >
  expense-network-dev - 3-AZ VPC, public/private subnets, IGW, NAT (one in
  dev; per-AZ when EnvName is staging or prod), app security group.

Parameters:
  EnvName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment used for naming and environment-specific NAT topology.
  VpcCidr:
    Type: String
    Default: 10.44.0.0/16
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    Description: IPv4 CIDR allocated to the expense VPC.
    ConstraintDescription: Must be a valid IPv4 CIDR in /16-/28.

  OwnerTag:
    Type: String
    Default: manya-bhasin
    Description: Required sandbox SCP tag "user".
  PersonName:
    Type: String
    Default: manya
    Description: Per-person suffix for account-unique names.

Conditions:
  IsProdLike: !Or
    - !Equals [!Ref EnvName, staging]
    - !Equals [!Ref EnvName, prod]
  IsDev: !Not [!Condition IsProdLike]
  # IsDev is the inverse of IsProdLike (assignment). NAT-A is always created;
  # NAT-B/C are gated on IsProdLike so IsDev stays explicit for reviewers.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: VPC flow logs are out of scope for Day 3.
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-vpc
        - Key: NatPattern
          Value: !If [IsDev, single-nat, nat-per-az]
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}
        - {Key: Purpose, Value: training}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-igw
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets for NAT and ALB must assign public IPs.
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-public-a
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets for NAT and ALB must assign public IPs.
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-public-b
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W33
            reason: Public subnets for NAT and ALB must assign public IPs.
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 8, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-public-c
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-private-a
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-private-b
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 8, 8]]
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-private-c
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-nat-eip-a
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-nat-a
        # The sandbox SCP reserves env=sandbox; Environment carries the
        # deployment environment for cost allocation.
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}
        - {Key: service, Value: expense}
        - {Key: tenant, Value: shared}
        - {Key: feature, Value: categorize-expense}
        - {Key: Environment, Value: !Ref EnvName}

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: IsProdLike
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-nat-eip-b
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  NatGatewayBPerAz:
    Type: AWS::EC2::NatGateway
    Condition: IsProdLike
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-nat-b
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}
        - {Key: service, Value: expense}
        - {Key: tenant, Value: shared}
        - {Key: feature, Value: categorize-expense}
        - {Key: Environment, Value: !Ref EnvName}

  NatEipC:
    Type: AWS::EC2::EIP
    Condition: IsProdLike
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-nat-eip-c
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  NatGatewayCPerAz:
    Type: AWS::EC2::NatGateway
    Condition: IsProdLike
    Properties:
      AllocationId: !GetAtt NatEipC.AllocationId
      SubnetId: !Ref PublicSubnetC
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-nat-c
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}
        - {Key: service, Value: expense}
        - {Key: tenant, Value: shared}
        - {Key: feature, Value: categorize-expense}
        - {Key: Environment, Value: !Ref EnvName}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-public-rt
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  PublicAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-private-rt-a
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PrivateRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-private-rt-b
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PrivateRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [IsProdLike, !Ref NatGatewayBPerAz, !Ref NatGatewayA]

  PrivateAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-private-rt-c
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

  PrivateRouteC:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [IsProdLike, !Ref NatGatewayCPerAz, !Ref NatGatewayA]

  PrivateAssocC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref PrivateRouteTableC

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: Explicit GroupName required for operators and cross-stack references.
          - id: W5
            reason: App tasks need HTTPS egress (443) to the internet via NAT.
    Properties:
      GroupName: !Sub "expense-${PersonName}-${EnvName}-app-sg"
      GroupDescription: expense-api in-VPC 8080; egress 443; 5432 added by app stack
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidr
          Description: HTTP from inside the VPC only (no 0.0.0.0/0)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to the internet
      Tags:
        - Key: Name
          Value: !Sub expense-${EnvName}-app-sg
        - {Key: env, Value: sandbox}
        - {Key: user, Value: !Ref OwnerTag}
        - {Key: Project, Value: expense}

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB, !Ref PublicSubnetC]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnets"
  PrivateSubnets:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnets"
  AppSgId:
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AppSgId"
  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"
