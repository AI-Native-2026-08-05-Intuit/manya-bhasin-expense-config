# CloudFormation lint + nag + validate-template
# Runs on PRs that touch cfn/ against the gitops default branch (config-1).
name: cfn-validate

on:
  pull_request:
    branches: [config-1]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-validate:
    name: cfn-lint, cfn-nag, validate-template
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Point tool cache at $HOME (not /Users/runner)
        run: |
          mkdir -p "$HOME/hostedtoolcache"
          echo "AGENT_TOOLSDIRECTORY=$HOME/hostedtoolcache" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$HOME/hostedtoolcache" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install cfn-lint + serverless extra rules
        run: |
          python -m pip install --upgrade pip
          pip install "cfn-lint>=1.20" cfn-lint-serverless

      - name: Run cfn-lint (serverless profile)
        run: |
          cfn-lint --version
          cfn-lint \
            -a cfn_lint_serverless.rules \
            --regions us-east-1 \
            -t cfn/expense-bootstrap-dev.yaml \
            -t cfn/expense-network-dev.yaml \
            -t cfn/expense-app-dev.yaml \
            -t cfn/expense-artifacts-dev.yaml

      - name: Set up Ruby for cfn-nag
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1.299.0
        with:
          ruby-version: "3.2"

      - name: Run cfn-nag (fail on warnings)
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          gem install cfn-nag -v 0.8.10
          cfn_nag_scan --version
          cfn_nag_scan --fail-on-warnings --input-path cfn/

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: arn:aws:iam::625397071689:role/expense-api-cfn-deploy
          aws-region: us-east-1
          role-session-name: gh-cfn-validate-${{ github.run_id }}

      - name: aws cloudformation validate-template
        run: |
          set -euo pipefail
          for f in cfn/*.yaml; do
            echo "validate-template ${f}"
            aws cloudformation validate-template --template-body "file://${f}" --region us-east-1
          done
