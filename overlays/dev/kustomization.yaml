# overlays/dev — smallest viable patch over base.
# Staging/prod repeat this shape with different namespace, replicas, and log level.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: expense-dev

# Overlay resources land in wave 0. CreateNamespace=true creates the
# Namespace before this list (no Namespace object in Git).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

# W6 D1 pushes to ECR, so the pullable ref is the ECR registry -- a bare
# uptimecrew/expense-api resolves to Docker Hub and 404s. newTag is the CI
# commit SHA; _bump-config.yml rewrites that line only.
# W6 D1 pushes to ECR, so the pullable ref is the ECR registry -- a bare
# uptimecrew/expense-api resolves to Docker Hub and 404s. newTag is the CI
# commit SHA; _bump-config.yml rewrites that one line.
images:
  - name: uptimecrew/expense-api
    newName: 625397071689.dkr.ecr.us-east-1.amazonaws.com/uptimecrew/expense-api
    newTag: 70ff4abdf369b6a941fc5db679e504f48c5ad8f2

replicas:
  - name: expense-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: expense-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.expense-dev.svc.cluster.local:5432/expense_tracking
      - op: replace
        path: /data/SPRING_REDIS_HOST
        value: redis.expense-dev.svc.cluster.local
      - op: replace
        path: /data/SPRING_DATA_MONGODB_URI
        value: mongodb://mongo.expense-dev.svc.cluster.local:27017/expense
      - op: replace
        path: /data/SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.expense-dev.svc.cluster.local:9092
  - target:
      kind: HorizontalPodAutoscaler
      name: expense-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
