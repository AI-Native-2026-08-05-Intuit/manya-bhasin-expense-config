# overlays/dev — smallest viable patch over base.
# Staging/prod repeat this shape with different namespace, replicas, and log level.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: expense-dev

# Overlay resources land in wave 0. CreateNamespace=true creates the
# Namespace before this list (no Namespace object in Git).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

images:
  - name: uptimecrew/expense-api
    newName: uptimecrew/expense-api
    newTag: 36627f39ee74f1397a5f1dabd9294422efd27128

replicas:
  - name: expense-api
    count: 1

patches:
  - target:
      kind: ConfigMap
      name: expense-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: DEBUG
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.expense-dev.svc.cluster.local:5432/expense_tracking
      - op: replace
        path: /data/SPRING_REDIS_HOST
        value: redis.expense-dev.svc.cluster.local
      - op: replace
        path: /data/SPRING_DATA_MONGODB_URI
        value: mongodb://mongo.expense-dev.svc.cluster.local:27017/expense
      - op: replace
        path: /data/SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.expense-dev.svc.cluster.local:9092
  - target:
      kind: HorizontalPodAutoscaler
      name: expense-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
