# overlays/prod — same shape as overlays/dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: expense-prod

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

images:
  - name: uptimecrew/expense-api
    newName: 625397071689.dkr.ecr.us-east-1.amazonaws.com/uptimecrew/expense-api
    newTag: 70ff4abdf369b6a941fc5db679e504f48c5ad8f2

replicas:
  - name: expense-api
    count: 3

patches:
  - target:
      kind: ConfigMap
      name: expense-api-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: prod
      - op: replace
        path: /data/LOG_LEVEL
        value: WARN
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: jdbc:postgresql://postgres.expense-prod.svc.cluster.local:5432/expense_tracking
      - op: replace
        path: /data/SPRING_REDIS_HOST
        value: redis.expense-prod.svc.cluster.local
      - op: replace
        path: /data/SPRING_DATA_MONGODB_URI
        value: mongodb://mongo.expense-prod.svc.cluster.local:27017/expense
      - op: replace
        path: /data/SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka.expense-prod.svc.cluster.local:9092
  - target:
      kind: HorizontalPodAutoscaler
      name: expense-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
